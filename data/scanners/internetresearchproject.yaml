opt_out: abuse@linode.com
note: 'Unknown operator on rented Linode (Akamai, AS63949) servers; no own ASN. The domain (registered 2019-06-26 at Namecheap, owner hidden by Withheld for Privacy) has Cloudflare DNS and Google mail but no website: it has no A record. Hosts are named sinkdev-N, bigdev-N and cloud-scanner-<8 hex digits>; a cloud-scanner name changes when the server is recreated (45.33.87.113 was cloud-scanner-25108270 in OpenFilters issue 5 and is cloud-scanner-55f56666 now), so addresses are short-lived and some listed ones already have no PTR or a plain Linode one. Mail operators saw connections to mail servers that drop before any login attempt (mailop, May 2022); Linode called the customer a legitimate security researcher and offered to forward a list of addresses to leave out, which is what opt_out points to. A PTR sweep of AS63949 on 2026-11-23 found 99 cloud-scanner hosts at 07:25 UTC (93 of them new here); at 08:00 UTC none of the 99 had a PTR any more (NXDOMAIN at the Akamai name servers), only the 8 sinkdev and bigdev hosts were left, so the cloud-scanner addresses are kept as a dated record and may already belong to other Linode customers.'
